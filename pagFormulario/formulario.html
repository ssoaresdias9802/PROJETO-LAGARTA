'<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="formulario.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="formulario.js"></script>
</head>
<body>

  <section class="formulario-section">
    <form class="form-card">
      <h2>Formulário de Cadastro</h2>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" placeholder="00000-000" required>

      <div class="btns">
        <button type="button" class="voltar" onclick="history.back()">Voltar</button>
        <button type="submit" id="enviar" class="enviar">Enviar</button>
      </div>
    </form>
  </section>
  <script>
    const form = document.getElementById('form-card');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // evita o envio real
      alert('Você realizou o cadastro com sucesso!');
    });
  </script>

</body>
</html>
